name: Backend CI

# Sin filtro de rama en push: una rama de feature tiene que ver el CI antes del merge.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn test

  # La imagen se construye siempre, tambien en un PR: un Dockerfile roto tiene que
  # aparecer antes del merge y no cuando alguien intenta desplegar. Publicar, en cambio,
  # solo ocurre en un push a main y despues de que los tests pasen.
  image:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/enzoaa004/pfi-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Sin credenciales propias: GITHUB_TOKEN alcanza para GHCR del mismo owner.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El tag por SHA es el que sirve para reproducir: `latest` se mueve y no identifica
      # nada. La label `image.source` es la que hace que GHCR vincule el paquete a este
      # repositorio.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
