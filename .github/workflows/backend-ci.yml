name: Backend CI

# Sin filtro de rama en push: una rama de feature tiene que ver el CI antes del merge.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # `verify` y no `test`: es la fase donde JaCoCo genera el reporte, una vez que
      # surefire termino de escribir jacoco.exec. Ademas verifica que el jar se arme, que
      # antes no se comprobaba en ningun lado aunque el Dockerfile dependa de eso.
      - name: Run tests with coverage
        run: mvn verify

      # El porcentaje tiene que verse sin descargar nada: va al summary del job.
      # Se lee el CSV de JaCoCo, que es la fuente de la verdad del mismo reporte HTML.
      - name: Coverage summary
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "No se genero $CSV" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$CSV" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import csv, sys
          from collections import defaultdict

          pkgs, total = defaultdict(lambda: defaultdict(int)), defaultdict(int)
          keys = ("INSTRUCTION_MISSED", "INSTRUCTION_COVERED", "BRANCH_MISSED",
                  "BRANCH_COVERED", "LINE_MISSED", "LINE_COVERED")
          with open(sys.argv[1], newline="", encoding="utf-8") as fh:
              for row in csv.DictReader(fh):
                  pkg = row["PACKAGE"].replace("ar.edu.uade.pfi.backend", "").lstrip(".") or "(raiz)"
                  for k in keys:
                      pkgs[pkg][k] += int(row[k]); total[k] += int(row[k])

          def pct(c, m):
              d = c + m
              return f"{100.0 * c / d:.1f}%" if d else "n/a"

          lt = total["LINE_COVERED"] + total["LINE_MISSED"]
          bt = total["BRANCH_COVERED"] + total["BRANCH_MISSED"]
          print("## Cobertura del backend\n")
          print(f"**Lineas: {pct(total['LINE_COVERED'], total['LINE_MISSED'])}** "
                f"({total['LINE_COVERED']}/{lt}) &nbsp;&nbsp; "
                f"**Ramas: {pct(total['BRANCH_COVERED'], total['BRANCH_MISSED'])}** "
                f"({total['BRANCH_COVERED']}/{bt})\n")
          print("| Paquete | Lineas | Ramas | Cubiertas/Total |")
          print("|---|---:|---:|---:|")
          rows = sorted(pkgs.items(), key=lambda kv: -(kv[1]["LINE_COVERED"] + kv[1]["LINE_MISSED"]))
          for pkg, m in rows:
              n = m["LINE_COVERED"] + m["LINE_MISSED"]
              print(f"| `{pkg}` | {pct(m['LINE_COVERED'], m['LINE_MISSED'])} "
                    f"| {pct(m['BRANCH_COVERED'], m['BRANCH_MISSED'])} | {m['LINE_COVERED']}/{n} |")
          print("\nReporte HTML completo: artifact `jacoco-report`.")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 14

  # La imagen se construye siempre, tambien en un PR: un Dockerfile roto tiene que
  # aparecer antes del merge y no cuando alguien intenta desplegar. Publicar, en cambio,
  # solo ocurre en un push a main y despues de que los tests pasen.
  image:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/enzoaa004/pfi-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Sin credenciales propias: GITHUB_TOKEN alcanza para GHCR del mismo owner.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El tag por SHA es el que sirve para reproducir: `latest` se mueve y no identifica
      # nada. La label `image.source` es la que hace que GHCR vincule el paquete a este
      # repositorio.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
